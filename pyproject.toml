[project]
name = "modis-majortom"
version = "0.1.0"
description = "MODIS satellite data collection, cloud masking, and MajorTom grid utilities"
authors = [
  { name = "Riccardo D'Ercole" }
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "xarray>=2025.8.0",
    "numpy>=2.3.3",
    "geopandas>=1.1.1",
    "rasterio>=1.4.3",
    "rioxarray>=0.19.0",
    "tqdm>=4.67.1",
    "zarr>=3.1.3",
    "earthengine-api>=1.6.10",
    "geemap>=0.36.4",
    "pyhdf>=0.11.6",
    "h5py>=3.12.1",
    "earthaccess>=0.15.1",
    "satpy>=0.58.0",
    "dotenv>=0.9.9",
    "pystac-client>=0.9.0",
    "cartopy>=0.25.0",
    "minio>=7.2.20",
    "joblib>=1.5.3",
    "torch>=2.9.1",
    "torchvision",
    "timm>=1.0.22",
    "scipy",
    "matplotlib>=3.10.6",
    "pandas",
    "pyproj",
    "majortom",
    "dask",
]

[tool.uv.sources]
majortom = { git = "https://github.com/ESA-PhiLab/Major-TOM.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modis_majortom"]
